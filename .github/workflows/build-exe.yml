name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r desktop/requirements.txt
      - name: Build exe
        run: pyinstaller --noconfirm desktop/build.spec
      - name: Add config
        shell: pwsh
        run: |
          Set-Content dist/config.ini "[tracker]`n# Paste your website address here to share data with phones.`n# Leave blank to keep a private copy on this computer.`nserver_url ="
          Compress-Archive -Path dist/MaterialTracker.exe, dist/config.ini -DestinationPath MaterialTracker-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MaterialTracker-windows
          path: MaterialTracker-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MaterialTracker-windows.zip
